<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator App</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0072ff">

   <!-- Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Landing Page -->
    <div id="landing-page">
        <h1>Welcome To My Calculator</h1>
    </div>

    <!-- Main App --> 
    <div id="app" class="hidden">
        <header class="header">
             <div class="logo">
                🧮 My Calculator
            </div>

            <button id="install-btn" hidden>
                Install App
            </button>

            <button id="theme-btn">
                🌙 Dark Mode
            </button>
        </header>
        <div class="container">
        <main class="calculator">
            <form onsubmit="return false;">
                <div class="result">
                    <input type="text" name="result" readonly />
                </div>
                <div>
                    <input type="button" value="AC" onclick="cal('AC')" class="ac" />
                    <input type="button" value="DE" onclick="cal('DE')" class="operator" />
                    <input type="button" value="." onclick="cal('.')" class="operator" />
                    <input type="button" value="/" onclick="cal('/')" class="operator" />
                </div>
                <div>
                    <input type="button" value="7" onclick="cal('7')" />
                    <input type="button" value="8" onclick="cal('8')" />
                    <input type="button" value="9" onclick="cal('9')" />
                    <input type="button" value="*" onclick="cal('*')" class="operator" />
                </div>
                <div>
                    <input type="button" value="4" onclick="cal('4')"  />
                    <input type="button" value="5" onclick="cal('5')"  />
                    <input type="button" value="6" onclick="cal('6')"  />
                    <input type="button" value="-" onclick="cal('-')" class="operator" />
                </div>
                <div>
                    <input type="button" value="1" onclick="cal('1')"  />
                    <input type="button" value="2" onclick="cal('2')"  />
                    <input type="button" value="3" onclick="cal('3')"  />
                    <input type="button" value="+" onclick="cal('+')" class="operator" />
                </div>
                <div>
                    <input type="button" value="00" onclick="cal('00')"  />
                    <input type="button" value="0" onclick="cal('0')"  />
                    <input type="button" value="=" onclick="cal('=')" class="operator equal" />
                </div>
                
            </form>
        </main>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("sw.js")
            .then(() => {
                console.log("Service Worker Registered");
            })
            .catch(err => {
                console.log("SW Error:", err);
            });

    });

}
    </script>
</body>
</html>
